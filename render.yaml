services:
  - type: web
    name: team-availability
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/availability.db
    disk:
      name: availability-data
      mountPath: /var/data
      sizeGB: 1
