<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <title>Team access</title>
  </head>
  <body>
    <main class="narrow">
      <section class="card">
        <h1>Team access</h1>
        <p>Enter the shared access code to view and submit availability.</p>
        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post" class="stack">
          <input
            type="password"
            name="access_code"
            placeholder="Access code"
            required
            autofocus
          >
          <button class="primary" type="submit">Continue</button>
        </form>
      </section>
    </main>
  </body>
</html>
